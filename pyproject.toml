[project]
name = "production-grade-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.14.1",
    "prometheus-client>=0.21,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=5.3,<7.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20,<1.0",
    "sentence-transformers>=3.4,<6.0",
    "slowapi>=0.1.10",
    "structlog>=25.1,<26.0",
    "tenacity>=9.0,<10.0",
    "torch>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
